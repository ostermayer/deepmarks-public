name: Deepmarks
summary: Nostr-native social bookmarks and long-tail archives.
description: |
  Deepmarks is a Nostr-native bookmarking app for saving, tagging,
  importing, exporting, and sharing links on open relays. Public
  bookmarks are signed Nostr events, private bookmarks are encrypted,
  and lifetime members can queue long-tail page archives.

  The mobile app can also act as a Nostr signer. It supports NIP-46
  remote signer pairing links and Android NIP-55 signer intents so
  users can keep their key on their phone while signing into compatible
  Nostr apps.

