# Box B — archive worker.
# Pulls jobs from Box A's Redis over the VPC (10.0.0.2:6379).
# No inbound ports; outbound only for Wayback, Blossom mirrors, S3.

services:
  archive-worker:
    build: ../../archive-worker
    restart: unless-stopped
    cpus: "1.5"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD_URLENC}@10.0.0.2:6379
      ARCHIVE_WORKER_NSEC: ${ARCHIVE_WORKER_NSEC}
      PAYMENT_PROXY_URL: http://10.0.0.2:4000
      WORKER_CALLBACK_SECRET: ${WORKER_CALLBACK_SECRET}
      BLOSSOM_PRIMARY_URL: https://blossom.deepmarks.org
      BLOSSOM_MIRROR_URLS: ${BLOSSOM_MIRROR_URLS:-https://blossom.primal.net}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      # Lowered 4 -> 1 so large archive blobs and mirror fanout stay under
      # Linode's 10 Mb/s notification threshold. Each job uploads to Box A
      # and then mirrors, so throughput doubles across A/B during successes.
      # This is deliberately background preservation, not realtime capture.
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      PLAYWRIGHT_NAV_TIMEOUT_MS: "30000"
      # 120s outer cap — the slow-scroll lazy-load pass alone can take
      # ~60s on long article pages, plus networkidle waits + the
      # SingleFile capture step. Was 60s before the render-quality
      # tightening; jobs were being aborted mid-scroll and capturing
      # incomplete pages.
      PLAYWRIGHT_RENDER_TIMEOUT_MS: "120000"
      PLAYWRIGHT_VIEWPORT: 1280x800
      # Live render remains primary. If it fails, use the closest
      # Wayback snapshot as a rescue source and store those bytes in
      # Blossom instead of losing the archive.
      WAYBACK_MAX_AGE_DAYS: ${WAYBACK_MAX_AGE_DAYS:-36500}
      ARCHIVE_AUDIT_INTERVAL_MS: ${ARCHIVE_AUDIT_INTERVAL_MS:-600000}
      ARCHIVE_AUDIT_STALE_AFTER_SECONDS: ${ARCHIVE_AUDIT_STALE_AFTER_SECONDS:-7200}
      ARCHIVE_AUDIT_MAX_JOBS: ${ARCHIVE_AUDIT_MAX_JOBS:-1000}
      # Bound the audit loop so a large archive history cannot prevent
      # dm:archive-audit:last from being refreshed.
      ARCHIVE_AUDIT_MAX_RUNTIME_MS: ${ARCHIVE_AUDIT_MAX_RUNTIME_MS:-240000}
      MEDIA_ARCHIVE_MAX_BYTES: ${MEDIA_ARCHIVE_MAX_BYTES:-2147483648}
      MEDIA_ARCHIVE_TMPDIR: /var/tmp/deepmarks-archive
      WORKER_HEARTBEAT_INTERVAL_MS: "10000"
      STAGED_BLOB_TTL_SECONDS: "900"
      LOG_LEVEL: info
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/worker:size=256m,mode=700,uid=1001,gid=1001
    volumes:
      - /mnt/deepmarks-archive-tmp/archive-worker:/var/tmp/deepmarks-archive
    pids_limit: 512
    mem_limit: 4g
    shm_size: 2g

  # ── strfry replica — live second copy of relay.deepmarks.org ────────
  # Box A's strfry-stream sidecar pushes every new event here over the
  # VPC within seconds, cutting the relay's recovery point from "last
  # nightly export" (~24h) to near-zero. VPC-only — never exposed
  # publicly. Seed once after first boot (and after any DB reset):
  #   ssh <box-a> 'cd /opt/deepmarks-repo/deploy/box-a && \
  #     docker compose exec -T strfry strfry export' | \
  #   docker compose exec -T strfry-replica strfry import
  strfry-replica:
    build: ../box-a/strfry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection(7777,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1));setTimeout(()=>process.exit(2),3000)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./strfry-replica.conf:/etc/strfry.conf:ro
      - strfry-replica-db:/var/lib/strfry
    ports:
      - "10.0.0.3:7777:7777"

volumes:
  strfry-replica-db:
