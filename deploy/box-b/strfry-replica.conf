# strfry replica on Box B — live second copy of relay.deepmarks.org.
#
# Box A's strfry-stream sidecar pushes every new event here over the VPC
# the moment it lands (strfry stream ws://10.0.0.3:7777 --dir up),
# cutting the recovery point from "last nightly export" (~24h) to
# seconds. NOT public: VPC-only bind, no public hostname. Differences
# from the primary's conf, on purpose: no writePolicy plugin (the only
# writer is Box A's sidecar, forwarding events the primary's policy
# already accepted) and age windows disabled (replication/seed traffic
# replays old events with their original created_at).
#
# Derived from deploy/box-a/strfry/strfry.conf — keep in sync when the
# primary's limits change.

# strfry config for the Deepmarks relay.
# Read-open: anyone can subscribe.
# Write-restricted via writePolicy: relay-allowed pubkeys can publish
# only Deepmarks-supported user state (profiles, deletes, contacts,
# relay lists, mute lists, bookmark/private/follow-set kinds, zap
# receipts, bunker messages). payment-proxy's /publish endpoint is the
# normal ingress.

db = "/var/lib/strfry"

dbParams {
  maxreaders = 256
  mapsize = 10737418240   # 10 GB
  noReadAhead = false
}

relay {
  nofiles = 65536
  bind = "0.0.0.0"
  port = 7777

  # Public-facing header used in the relay information document (NIP-11).
  # `pubkey` advertises the relay-operator identity (the brand npub) so
  # clients can show a recognizable owner instead of an anonymous relay.
  # `icon` shows the brand pennant in relay pickers (Damus/Amethyst/etc).
  info {
    name = "deepmarks"
    description = "deepmarks: social bookmarking via Nostr"
    pubkey = "2944e915ba71cf0fc19f5dda048ce053a87c01fd7478b179330a17edca4ce2f4"
    contact = "alerts@deepmarks.org"
    icon = "https://deepmarks.org/pennant.svg"
    software = "git+https://github.com/hoytech/strfry.git"
    version = "latest"
  }

  # Conservative defaults; Box A has 4 GB total.
  # Must exceed maxEventSize + envelope overhead or events between the
  # two limits pass policy on paper and die at the socket (the exact
  # "silently dropped private chunk" class the 512 KB bump fixed).
  maxWebsocketPayloadSize = 786432
  autoPingSeconds = 55
  writePolicy {
    plugin = ""
    lookbackSeconds = 0
  }
  maxFilterLimit = 500
  maxSubsPerConnection = 20
}

events {
  # 512KB. Deepmarks' encrypted private bookmark chunks (kind:30003,
  # NIP-44 ciphertext + base64 + JSON envelope) exceed the strfry
  # default of 64KB once a chunk is full. The previous 64KB cap was
  # silently dropping those chunks on publish — clients fell back to
  # the user's NIP-65 relays (nos.lol, primal, damus), and the same
  # bookmarks then appeared in the iOS app + extension (which read the
  # union of all relays) but not on the web (which leans on this
  # relay). Headroom of 512KB covers a worst-case 65535-byte plaintext
  # chunk after encryption + serialization, and is comfortably below
  # what major relays accept.
  maxEventSize = 524288
  # 10 years — the onboarding scanner forwards users' ORIGINAL signed
  # events with their original created_at; a 3-year window silently
  # bounced long-time Nostr users' old bookmarks/lists during import
  # (the writePolicy's kind+registry gates already bound abuse).
  rejectEventsOlderThanSeconds = 0  # replica: stream/seed replays old events
  rejectEventsNewerThanSeconds = 0  # replica: trust the primary-validated stream
  rejectEphemeralEventsOlderThanSeconds = 60
  ephemeralEventsLivetimeSeconds = 300
  maxNumTags = 2000
  maxTagValSize = 1024
}
